<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lilien für Celina</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fff5f8;
    --bg2: #fde4ec;
    --text: #8a3b5c;
    --sub: #b2768f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 35%, var(--bg1), var(--bg2));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden; padding: 16px;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }
  svg { width: min(92vw, 560px); height: auto; overflow: visible; }

  .stem {
    stroke-dasharray: 600; stroke-dashoffset: 600;
    animation: grow 2s ease-out forwards;
  }
  .leaf { opacity: 0; transform-box: fill-box; transform-origin: bottom center;
    animation: leafIn 1s ease-out forwards; }
  .bloom { transform-box: fill-box; transform-origin: center; transform: scale(0) rotate(-40deg);
    animation: bloom 1.6s cubic-bezier(.2,.9,.3,1.2) forwards; }
  .sway { transform-box: view-box; animation: sway 6s ease-in-out infinite alternate; }
  .ribbon { opacity: 0; animation: fade 1s ease forwards 2.4s; }

  @keyframes grow { to { stroke-dashoffset: 0; } }
  @keyframes leafIn { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes bloom { to { transform: scale(1) rotate(0); } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes sway { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }

  .hippo { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(0);
    animation: hippoIn 1.2s cubic-bezier(.2,.9,.3,1.4) forwards 2.6s; }
  .wave { transform-box: fill-box; transform-origin: 50% 100%;
    animation: wave 1.4s ease-in-out infinite 3.8s; }
  .heart { opacity: 0; animation: heart 3s ease-in-out infinite 4s; }
  @keyframes hippoIn { to { transform: scale(1); } }
  @keyframes wave { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-25deg); } }
  @keyframes heart {
    0% { opacity: 0; transform: translate(0, 0) scale(.6); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translate(-6px, -40px) scale(1); }
  }

  h1 {
    font-family: 'Great Vibes', cursive; font-weight: 400;
    color: var(--text); font-size: clamp(2.6rem, 10vw, 4.4rem);
    margin: 4px 0 0; opacity: 0; animation: fade 1.5s ease forwards 3s;
    text-shadow: 0 2px 12px rgba(255,255,255,.8);
  }
  p.sub {
    color: var(--sub); font-style: italic; font-size: clamp(1rem, 4vw, 1.3rem);
    margin: 4px 0 0; opacity: 0; animation: fade 1.5s ease forwards 3.8s; text-align: center;
  }

  .petal-fall {
    position: fixed; top: -30px; width: 14px; height: 22px; pointer-events: none;
    background: radial-gradient(ellipse at 50% 30%, #fff, #f7c6d6);
    border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    opacity: .85; animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); opacity: 0; }
  }
</style>
</head>
<body>

<svg id="bouquet" viewBox="-50 0 700 640"aria-label="Ein Strauß weißer und rosa Lilien">
  <defs>
    <linearGradient id="petalWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#fff4f7"/>
      <stop offset="1" stop-color="#f6c3d3"/>
    </linearGradient>
    <linearGradient id="petalPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6ee"/>
      <stop offset=".55" stop-color="#f48fb1"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aa84f"/>
      <stop offset="1" stop-color="#2e6b30"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2e7d32"/>
      <stop offset="1" stop-color="#81c784"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d81b60"/>
      <stop offset=".5" stop-color="#f06292"/>
      <stop offset="1" stop-color="#d81b60"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#b0476f" flood-opacity=".25"/>
    </filter>
  </defs>
  <g class="sway" style="transform-origin: 300px 560px">
    <g id="stems"></g>
    <g id="flowers" filter="url(#soft)"></g>
    <g id="buds"></g>
  </g>
  <g class="ribbon">
    <path d="M268 520 Q300 510 332 520 L328 548 Q300 540 272 548 Z" fill="url(#ribbonGrad)"/>
    <path d="M300 532 C 270 500, 240 520, 262 540 C 275 552, 292 540, 300 532 Z" fill="#e91e63"/>
    <path d="M300 532 C 330 500, 360 520, 338 540 C 325 552, 308 540, 300 532 Z" fill="#e91e63"/>
    <path d="M296 536 L270 600 L284 594 L292 610 Z" fill="#c2185b"/>
    <path d="M304 536 L330 600 L316 594 L308 610 Z" fill="#c2185b"/>
    <circle cx="300" cy="533" r="7" fill="#ad1457"/>
  </g>
  <!-- Happy Hippo -->
  <g transform="translate(470 555) scale(.8)">
    <g class="hippo">
      <ellipse cx="-30" cy="92" rx="20" ry="12" fill="#a993cf"/>
      <ellipse cx="30" cy="92" rx="20" ry="12" fill="#a993cf"/>
      <ellipse cx="0" cy="50" rx="58" ry="46" fill="#bfaae3"/>
      <ellipse cx="0" cy="60" rx="34" ry="28" fill="#d9ccf0"/>
      <ellipse cx="-52" cy="52" rx="11" ry="19" fill="#a993cf" transform="rotate(25 -52 52)"/>
      <g transform="translate(50 18) rotate(35)">
        <g class="wave"><ellipse cx="0" cy="-18" rx="11" ry="21" fill="#a993cf"/></g>
      </g>
      <ellipse cx="-34" cy="-58" rx="11" ry="10" fill="#a993cf"/>
      <ellipse cx="34" cy="-58" rx="11" ry="10" fill="#a993cf"/>
      <ellipse cx="-34" cy="-57" rx="5.5" ry="5" fill="#f6b6cc"/>
      <ellipse cx="34" cy="-57" rx="5.5" ry="5" fill="#f6b6cc"/>
      <ellipse cx="0" cy="-22" rx="46" ry="40" fill="#bfaae3"/>
      <ellipse cx="0" cy="-2" rx="40" ry="25" fill="#d9ccf0"/>
      <ellipse cx="-12" cy="-10" rx="4" ry="5.5" fill="#7d68a3"/>
      <ellipse cx="12" cy="-10" rx="4" ry="5.5" fill="#7d68a3"/>
      <path d="M-15 6 Q0 18 15 6" stroke="#7d68a3" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="-17" cy="-40" r="8" fill="#fff"/>
      <circle cx="17" cy="-40" r="8" fill="#fff"/>
      <circle cx="-16" cy="-39" r="4.8" fill="#3d2c55"/>
      <circle cx="18" cy="-39" r="4.8" fill="#3d2c55"/>
      <circle cx="-14.5" cy="-41" r="1.6" fill="#fff"/>
      <circle cx="19.5" cy="-41" r="1.6" fill="#fff"/>
      <ellipse cx="-34" cy="-22" rx="8" ry="5" fill="#f48fb1" opacity=".55"/>
      <ellipse cx="34" cy="-22" rx="8" ry="5" fill="#f48fb1" opacity=".55"/>
      <g class="heart">
        <path d="M66 -60 C 66 -68, 78 -68, 78 -60 C 78 -68, 90 -68, 90 -60 C 90 -50, 78 -44, 78 -40 C 78 -44, 66 -50, 66 -60 Z" fill="#e91e63"/>
      </g>
    </g>
  </g>
  <text x="532" y="575" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7d68a3"
        style="opacity:0; animation: fade 1s ease forwards 3.4s">
    <tspan x="532">(Das soll ein</tspan>
    <tspan x="532" dy="17">Happy Hippo sein)</tspan>
  </text>
</svg>

<h1>Für dich, Celina</h1>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };

  const base = { x: 300, y: 540 };
  // Blütenpositionen: x, y, Größe, Farbe, Drehung
  const lilies = [
    { x: 300, y: 150, s: 1.15, c: 'petalWhite', r: 0 },
    { x: 190, y: 210, s: 1.0,  c: 'petalPink',  r: -20 },
    { x: 410, y: 205, s: 1.0,  c: 'petalPink',  r: 18 },
    { x: 115, y: 310, s: 0.9,  c: 'petalWhite', r: -35 },
    { x: 485, y: 305, s: 0.9,  c: 'petalWhite', r: 32 },
    { x: 250, y: 290, s: 0.95, c: 'petalWhite', r: -8 },
    { x: 355, y: 295, s: 0.95, c: 'petalPink',  r: 10 },
  ];
  const buds = [
    { x: 230, y: 120, r: -18 }, { x: 375, y: 110, r: 16 },
    { x: 140, y: 230, r: -40 }, { x: 465, y: 225, r: 38 },
  ];

  const stems = document.getElementById('stems');
  const flowers = document.getElementById('flowers');
  const budsG = document.getElementById('buds');

  function stem(x, y, delay) {
    const cx = (x + base.x) / 2 + (x - base.x) * 0.15;
    const cy = (y + base.y) / 2 + 40;
    el('path', {
      d: `M${base.x} ${base.y} Q${cx} ${cy} ${x} ${y}`,
      class: 'stem', fill: 'none', stroke: 'url(#stemGrad)',
      'stroke-width': 5, 'stroke-linecap': 'round',
      style: `animation-delay:${delay}s`
    }, stems);
    // Blatt in der Mitte des Stiels
    const t = 0.55;
    const lx = (1-t)*(1-t)*base.x + 2*(1-t)*t*cx + t*t*x;
    const ly = (1-t)*(1-t)*base.y + 2*(1-t)*t*cy + t*t*y;
    const side = x < base.x ? -1 : 1;
    const ang = Math.atan2(y - base.y, x - base.x) * 180 / Math.PI + 90 + side * 35;
    const g = el('g', { transform: `translate(${lx} ${ly}) rotate(${ang})` }, stems);
    el('path', {
      d: 'M0 0 C 14 -18, 12 -48, 0 -66 C -12 -48, -14 -18, 0 0 Z',
      class: 'leaf', fill: 'url(#leafGrad)',
      style: `animation-delay:${delay + 1}s`
    }, g);
  }

  function lily({ x, y, s, c, r }, delay) {
    const pos = el('g', { transform: `translate(${x} ${y}) rotate(${r}) scale(${s})` }, flowers);
    const b = el('g', { class: 'bloom', style: `animation-delay:${delay}s` }, pos);
    const spot = c === 'petalPink' ? '#880e4f' : '#e57399';
    // Hintere drei Blütenblätter (breiter), dann vordere drei (schmaler)
    [[30, 1], [150, 1], [270, 1], [90, 0.85], [210, 0.85], [330, 0.85]].forEach(([a, w]) => {
      const p = el('g', { transform: `rotate(${a})` }, b);
      el('path', {
        d: `M0 0 C ${16*w} -14, ${26*w} -46, 4 -78 Q 0 -84 -4 -78 C ${-26*w} -46, ${-16*w} -14, 0 0 Z`,
        fill: `url(#${c})`, stroke: '#f3b6c9', 'stroke-width': 0.8
      }, p);
      el('path', { d: 'M0 -6 Q 2 -40 0 -70', stroke: 'rgba(200,80,120,.35)', 'stroke-width': 1.2, fill: 'none' }, p);
      for (let i = 0; i < 5; i++) {
        el('circle', {
          cx: (Math.random() - .5) * 10 * w, cy: -14 - Math.random() * 26,
          r: 0.9 + Math.random() * 0.9, fill: spot, opacity: .7
        }, p);
      }
    });
    // Staubblätter
    for (let i = 0; i < 6; i++) {
      const a = (i * 60 + 15) * Math.PI / 180;
      const len = 34 + (i % 2) * 6;
      const sx = Math.sin(a) * len, sy = -Math.cos(a) * len;
      el('path', { d: `M0 0 Q ${sx * .4} ${sy * .7} ${sx} ${sy}`, stroke: '#c5e1a5', 'stroke-width': 1.4, fill: 'none' }, b);
      el('ellipse', { cx: sx, cy: sy, rx: 2.4, ry: 5, fill: '#d2691e', transform: `rotate(${i * 60 + 15} ${sx} ${sy})` }, b);
    }
    el('path', { d: 'M0 0 L0 -44', stroke: '#aed581', 'stroke-width': 2 }, b);
    el('circle', { cx: 0, cy: -45, r: 3.2, fill: '#7cb342' }, b);
    el('circle', { cx: 0, cy: 0, r: 6, fill: '#c5e1a5' }, b);
  }

  function bud({ x, y, r }, delay) {
    const pos = el('g', { transform: `translate(${x} ${y}) rotate(${r})` }, budsG);
    const b = el('g', { class: 'bloom', style: `animation-delay:${delay}s` }, pos);
    el('path', { d: 'M0 0 C 10 -10, 9 -34, 0 -48 C -9 -34, -10 -10, 0 0 Z', fill: '#cfe8c0', stroke: '#9ccc65', 'stroke-width': 1 }, b);
    el('path', { d: 'M0 -2 Q 2 -24 0 -46', stroke: '#f8bbd0', 'stroke-width': 1.5, fill: 'none' }, b);
  }

  buds.forEach((p, i) => { stem(p.x, p.y + 4, i * 0.15); bud(p, 1.6 + i * 0.15); });
  lilies.forEach((p, i) => { stem(p.x, p.y, 0.1 + i * 0.12); lily(p, 1.8 + i * 0.18); });

  // Fallende Blütenblätter
  function dropPetal() {
    const d = document.createElement('div');
    d.className = 'petal-fall';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
    d.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    d.style.animationDuration = (6 + Math.random() * 5) + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 12000);
  }
  setTimeout(() => setInterval(dropPetal, 700), 3500);
</script>
</body>
</html>
